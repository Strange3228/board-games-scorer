<ion-content class="ion-padding empty-state">
  <div class="flex__center">
    <ion-icon [name]="icon" class="empty-state__icon"></ion-icon>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
    <app-primary-button
      [label]="buttonText"
      (clicked)="buttonClick.emit()">
    </app-primary-button>
  </div>
</ion-content>
