<ion-button
  class="primary-btn"
  [textContent]="label"
  [expand]="fullWidth ? 'block' : undefined"
  [color]="color"
  [ngClass]="{
    'outline-btn': type === 'outline',
    'text-btn': type === 'text',
    'size-sm': size === 'sm',
    'size-md': size === 'md',
    'size-lg': size === 'lg',
    'has-icon': !!icon,
    'icon-end': iconPosition === 'end'
  }"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
</ion-button>
