<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="actions-grid">
    <div class="action-item" (click)="onNewGame()">
      <div class="action-circle">
        <ion-icon name="trophy-outline"></ion-icon>
      </div>
      <span class="action-label">New Game</span>
    </div>

    <div class="action-item" (click)="router.navigate(['/players/create'])">
      <div class="action-circle">
        <ion-icon name="person-add-outline"></ion-icon>
      </div>
      <span class="action-label">New Player</span>
    </div>

    <div class="action-item" (click)="router.navigate(['/templates/create'])">
      <div class="action-circle">
        <ion-icon name="document-outline"></ion-icon>
      </div>
      <span class="action-label">New Template</span>
    </div>
  </div>

  <div class="most-played-section" *ngIf="mostPlayedTemplates.length > 0">
    <div class="section-header">
      <h2>Most Popular Games</h2>
      <ion-button fill="clear" size="small" (click)="router.navigate(['/templates'])">
        See all
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-button>
    </div>

    <div class="templates-grid">
      <div class="template-card" *ngFor="let item of mostPlayedTemplates" (click)="onNewGame()">
        <div class="template-icon">
          <ion-icon name="game-controller-outline"></ion-icon>
        </div>
        <div class="template-info">
          <h3>{{ item.template.name }}</h3>
          <p class="play-count">{{ item.playCount }} {{ item.playCount === 1 ? 'play' : 'plays' }}</p>
        </div>
      </div>
    </div>
  </div>
</ion-content>
