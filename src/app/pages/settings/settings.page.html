<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list [inset]="true">
    <ion-item>
      <ion-toggle
        [(ngModel)]="isDarkTheme"
        (ionChange)="toggleTheme()"
        justify="space-between"
      >Dark Mode</ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
