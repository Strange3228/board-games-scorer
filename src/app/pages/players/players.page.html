<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Players</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-empty-state
    *ngIf="!(players | async) || (players | async)?.length === 0"
    icon="person-add-outline"
    title="No Players yet"
    description="Add your first player to get started tracking game results."
    buttonText="Add Player"
    (buttonClick)="router.navigate(['players/create'])"
  />
</ion-content>
